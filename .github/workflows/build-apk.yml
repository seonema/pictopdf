name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Detect Project Directory
        id: locate_project
        run: |
          if [ -d "DocScannerApp" ]; then
            echo "DIR=DocScannerApp" >> $GITHUB_OUTPUT
          else
            echo "DIR=." >> $GITHUB_OUTPUT
          fi

      - name: Build with Gradle
        run: |
          cd ${{ steps.locate_project.outputs.DIR }}
          chmod +x gradlew || true
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease assembleDebug bundleRelease --stacktrace
          else
            echo "Gradle wrapper jar not found, generating wrapper..."
            gradle wrapper --gradle-version 8.6 || true
            chmod +x gradlew || true
            ./gradlew assembleRelease assembleDebug bundleRelease --stacktrace || gradle assembleRelease assembleDebug bundleRelease --stacktrace
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-APKs
          path: |
            ${{ steps.locate_project.outputs.DIR }}/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Upload AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocScanner-AAB-Bundle
          path: |
            ${{ steps.locate_project.outputs.DIR }}/app/build/outputs/bundle/**/*.aab
          retention-days: 14
